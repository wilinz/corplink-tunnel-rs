[package]
name = "corplink-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Self-contained pure-Rust CorpLink/feilian client: login + userspace WireGuard-over-TCP tunnel with a SOCKS5 proxy"
repository = "https://github.com/wilinz/corplink-tunnel-rs"

[lib]
name = "corplink_client"
path = "src/lib.rs"

[[bin]]
name = "corplink-client"
path = "src/main.rs"

[dependencies]
corplink-tunnel = { path = "../tunnel" }
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "gzip", "deflate", "cookies"] }
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
cookie = "0.17"
cookie_store = "0.20"
reqwest_cookie_store = "0.6"
tinytemplate = "1.2"
md5 = "0.7"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
base32 = "0.4"
base64 = "0.21"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
httpdate = "1.0"
chrono = "0.4"
cfg-if = "1.0"
hmac-sha1 = "0.1"
byteorder = "1.5"
log = "0.4"
env_logger = "0.10"
qrcode = "0.14.1"
terminal_graphics = "0.1.5"
anyhow = "1.0"
